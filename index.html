<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Car Factory Tycoon</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2b2b36; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-wrapper {
            position: relative;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #f0f3f4; /* Factory floor color */
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }
        .stats {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; }
        .money { font-size: 24px; font-weight: bold; color: #27ae60; }
        
        .controls {
            pointer-events: auto;
        }
        button {
            background-color: #f1c40f;
            color: #333;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d4ac0d;
            transition: transform 0.1s;
        }
        button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }
        button:disabled {
            background-color: #bdc3c7;
            box-shadow: 0 4px 0 #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="ui-layer">
            <div class="stats">
                <h2>Assembly Line 1</h2>
                <div class="money">$<span id="moneyText">0</span></div>
                <div style="color: #7f8c8d; margin-top: 5px; font-size: 14px;">
                    Output: $<span id="incomeText">10</span> / car
                </div>
            </div>
            
            <div class="controls">
                <button id="upgradeBtn" onclick="upgradeLine()">
                    Upgrade Station<br>
                    <span style="font-size: 12px; font-weight: normal;">Cost: $<span id="costText">50</span></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Economy
        let money = 0;
        let incomePerCar = 10;
        let upgradeCost = 50;
        let productionSpeed = 2; // Speed multiplier for animations

        // UI Elements
        const moneyText = document.getElementById('moneyText');
        const incomeText = document.getElementById('incomeText');
        const costText = document.getElementById('costText');
        const upgradeBtn = document.getElementById('upgradeBtn');

        // Game Entities
        let cars = [];
        let beltOffset = 0;
        let workerArmAngle = 0;

        // Add a new car to the start of the belt
        function spawnCar() {
            cars.push({ x: -100, color: `hsl(${Math.random() * 360}, 70%, 50%)` });
        }

        // Initialize first car
        spawnCar();

        function upgradeLine() {
            if (money >= upgradeCost) {
                money -= upgradeCost;
                incomePerCar *= 1.5;
                upgradeCost *= 1.8;
                productionSpeed *= 1.1; // Make the belt and cars move faster
                updateUI();
            }
        }

        function formatMoney(amount) {
            if (amount >= 1000000) return (amount / 1000000).toFixed(3) + " M";
            if (amount >= 1000) return (amount / 1000).toFixed(1) + " k";
            return amount.toFixed(0);
        }

        function updateUI() {
            moneyText.innerText = formatMoney(money);
            incomeText.innerText = formatMoney(incomePerCar);
            costText.innerText = formatMoney(upgradeCost);
            upgradeBtn.disabled = money < upgradeCost;
        }

        // Animation Loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Environment
            ctx.fillStyle = "#bdc3c7"; // Factory wall
            ctx.fillRect(0, 0, canvas.width, 150);
            
            // 2. Draw Conveyor Belt
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 250, canvas.width, 60);
            
            // Conveyor belt lines (moving effect)
            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 4;
            beltOffset += 1 * productionSpeed;
            if (beltOffset > 40) beltOffset = 0;
            
            for (let i = -40; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i + beltOffset, 250);
                ctx.lineTo(i + beltOffset, 310);
                ctx.stroke();
            }

            // 3. Draw Worker Station
            ctx.fillStyle = "#e67e22"; // Station desk
            ctx.fillRect(350, 200, 100, 50);
            
            // Draw Worker Character
            ctx.fillStyle = "#f1c40f"; // Hard hat
            ctx.beginPath();
            ctx.arc(400, 160, 20, Math.PI, 0);
            ctx.fill();
            
            ctx.fillStyle = "#f39c12"; // Face
            ctx.beginPath();
            ctx.arc(400, 175, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#2980b9"; // Uniform
            ctx.fillRect(380, 190, 40, 40);

            // Animated Worker Arm
            workerArmAngle = Math.sin(Date.now() / 200 * productionSpeed) * 0.5;
            ctx.save();
            ctx.translate(390, 200);
            ctx.rotate(workerArmAngle);
            ctx.fillStyle = "#e67e22"; // Arm color
            ctx.fillRect(0, 0, 10, 40);
            ctx.restore();

            // 4. Update and Draw Cars
            for (let i = cars.length - 1; i >= 0; i--) {
                let car = cars[i];
                car.x += 1.5 * productionSpeed; // Move car right

                // Draw Car Body
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, 210, 80, 30);
                ctx.fillRect(car.x + 15, 190, 50, 20); // Roof
                
                // Windows
                ctx.fillStyle = "#87ceeb";
                ctx.fillRect(car.x + 20, 195, 15, 15);
                ctx.fillRect(car.x + 45, 195, 15, 15);

                // Wheels
                ctx.fillStyle = "#222";
                ctx.beginPath();
                ctx.arc(car.x + 20, 245, 10, 0, Math.PI * 2);
                ctx.arc(car.x + 60, 245, 10, 0, Math.PI * 2);
                ctx.fill();

                // Process car leaving the screen (collecting money)
                if (car.x > canvas.width) {
                    money += incomePerCar;
                    cars.splice(i, 1);
                    spawnCar(); // Spawn a new car to keep the loop going
                    updateUI();
                }
            }

            // Add new car if the last one has moved far enough (ensures continuous line)
            if (cars.length > 0 && cars[cars.length - 1].x > 150) {
                spawnCar();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the game
        updateUI();
        gameLoop();
    </script>
</body>
</html>
