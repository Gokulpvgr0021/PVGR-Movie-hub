<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Pcs Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004494;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pcs Number Generator</h2>
    
    <label for="prefix">Prefix (Optional, e.g., PCS-):</label>
    <input type="text" id="prefix" placeholder="e.g., PCS-">

    <label for="startNum">Starting Number:</label>
    <input type="number" id="startNum" value="1" min="1">

    <label for="endNum">Ending Number:</label>
    <input type="number" id="endNum" value="100" min="1">

    <button onclick="generateNumbers()">Generate List</button>

    <textarea id="outputList" placeholder="Your continuous piece numbers will appear here..."></textarea>
</div>

<script>
    function generateNumbers() {
        const prefix = document.getElementById('prefix').value;
        const startNum = parseInt(document.getElementById('startNum').value);
        const endNum = parseInt(document.getElementById('endNum').value);
        const outputField = document.getElementById('outputList');
        
        if (startNum > endNum) {
            alert("Starting number cannot be greater than ending number.");
            return;
        }

        let result = [];
        for (let i = startNum; i <= endNum; i++) {
            result.push(prefix + i);
        }

        outputField.value = result.join('\n');
    }
</script>

</body>
</html>
