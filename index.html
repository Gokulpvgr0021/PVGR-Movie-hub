<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Industry Tycoon Prototype</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #2b2b36; 
            color: #333;
            padding: 50px; 
        }
        .game-container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
            max-width: 400px; 
            margin: auto; 
        }
        h2 { margin-top: 0; color: #4a4a5a; }
        .money-display {
            font-size: 28px;
            font-weight: bold;
            color: #27ae60;
            margin: 20px 0;
        }
        button { 
            background-color: #3498db; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            margin: 10px 0; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 16px;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .stats { margin-bottom: 20px; font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="game-container">
        <h2>Assembly Line 1</h2>
        <div class="money-display">
            $<span id="money">0</span>
        </div>
        <div class="stats">
            <p>Production: $<span id="income">10</span> / sec</p>
        </div>
        <button id="upgradeBtn" onclick="upgradeLine()">
            Upgrade Conveyor (Cost: $<span id="cost">50</span>)
        </button>
    </div>

    <script>
        // Game State Variables
        let money = 0;
        let income = 10;
        let upgradeCost = 50;

        // DOM Elements
        const moneyEl = document.getElementById('money');
        const incomeEl = document.getElementById('income');
        const costEl = document.getElementById('cost');
        const upgradeBtn = document.getElementById('upgradeBtn');

        // Update the visual text on the screen
        function updateUI() {
            moneyEl.innerText = formatMoney(money);
            incomeEl.innerText = formatMoney(income);
            costEl.innerText = formatMoney(upgradeCost);
            
            // Disable the upgrade button if you can't afford it
            upgradeBtn.disabled = money < upgradeCost;
        }

        // Format numbers to show millions like in the screenshot
        function formatMoney(amount) {
            if (amount >= 1000000) {
                return (amount / 1000000).toFixed(3) + " millions";
            }
            return amount.toFixed(0);
        }

        // Purchase an upgrade
        function upgradeLine() {
            if (money >= upgradeCost) {
                money -= upgradeCost;
                income *= 1.5;         // Boost income by 50%
                upgradeCost *= 1.8;    // Increase the next upgrade cost by 80%
                updateUI();
            }
        }

        // Core Idle Loop: Add money every second
        setInterval(() => {
            money += income;
            updateUI();
        }, 1000);

        // Initial UI render
        updateUI();
    </script>
</body>
</html>
