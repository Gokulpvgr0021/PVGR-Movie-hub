<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamNet - Movies & Downloads</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #141414; color: white; }
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); position: absolute; width: 100%; box-sizing: border-box; }
        .logo { font-size: 28px; font-weight: bold; color: #E50914; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover { color: #b3b3b3; }
        
        /* Hero Section */
        .hero { height: 80vh; background: linear-gradient(to right, rgba(0,0,0,0.8) 20%, transparent), url('https://via.placeholder.com/1600x900/333/555?text=Featured+Movie+Poster') center/cover; display: flex; align-items: center; padding: 0 50px; box-sizing: border-box; }
        .hero-content { max-width: 600px; }
        .hero h1 { font-size: 4rem; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; line-height: 1.5; margin-bottom: 30px; }
        
        /* Buttons */
        .btn { padding: 12px 30px; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; font-weight: bold; margin-right: 15px; transition: 0.2s; }
        .btn-play { background-color: white; color: black; }
        .btn-play:hover { background-color: #c9c9c9; }
        .btn-download { background-color: rgba(109, 109, 110, 0.7); color: white; }
        .btn-download:hover { background-color: rgba(109, 109, 110, 0.9); }
        
        /* Movie Rows */
        .movie-row { padding: 30px 50px; }
        .movie-row h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .posters { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .posters::-webkit-scrollbar { display: none; }
        .posters img { width: 220px; height: 330px; object-fit: cover; border-radius: 5px; cursor: pointer; transition: transform 0.3s ease; }
        .posters img:hover { transform: scale(1.08); }
    </style>
</head>
<body>
    <header>
        <div class="logo">StreamNet</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">TV Shows</a>
            <a href="#">My Downloads</a>
        </nav>
    </header>

    <div class="hero">
        <div class="hero-content">
            <h1>Epic Sci-Fi Adventure</h1>
            <p>A group of explorers travel through a wormhole in space in an attempt to ensure humanity's survival. Stream in stunning 4K or download for offline viewing.</p>
            <button class="btn btn-play">▶ Play Now</button>
            <button class="btn btn-download">⬇ Download</button>
        </div>
    </div>

    <div class="movie-row">
        <h2>Trending Now</h2>
        <div class="posters">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Action+Movie" alt="Movie">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Comedy+Special" alt="Movie">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Drama+Series" alt="Movie">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Thriller" alt="Movie">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Documentary" alt="Movie">
            <img src="https://via.placeholder.com/220x330/444/fff?text=Sci-Fi" alt="Movie">
        </div>
    </div>
</body>
</html>
