<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Auto Factory Tycoon</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #1e1e24;
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg); color: #333; 
            display: flex; flex-direction: column;
            -webkit-user-select: none; user-select: none; 
        }
        
        /* Canvas Area - Top Half on Mobile, Full on Desktop */
        .game-viewport {
            flex: 1 1 auto;
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #222f3e;
            cursor: grab;
        }
        .game-viewport:active { cursor: grabbing; }
        canvas { display: block; touch-action: none; }

        /* Top HUD */
        .hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none;
            z-index: 10; gap: 10px;
        }
        .stat-badge {
            background: rgba(255, 255, 255, 0.95); padding: 10px 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold; font-size: 16px; pointer-events: auto;
            display: flex; align-items: center; gap: 5px;
        }
        .money { color: var(--success); }
        .stock { color: #2980b9; }

        /* Bottom Control Panel - Scrollable for Mobile */
        .dashboard {
            flex: 0 0 45%; /* Takes up bottom 45% of screen on mobile */
            background: #f8f9fa;
            border-top: 4px solid var(--primary);
            overflow-y: auto;
            padding: 15px;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel-section {
            background: white; border-radius: 10px; padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .panel-section h3 { margin: 0 0 15px 0; font-size: 14px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }

        .part-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #f1f2f6; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px;
            font-weight: bold; font-size: 15px;
        }

        button {
            border: none; padding: 10px 15px; font-weight: bold; font-size: 14px;
            border-radius: 6px; cursor: pointer; transition: all 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); color: white;
        }
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        button:disabled { background: #bdc3c7 !important; box-shadow: 0 4px 0 #95a5a6 !important; cursor: not-allowed; }
        
        .btn-buy { background: #e67e22; }
        .btn-sell { background: var(--success); width: 100%; padding: 15px; font-size: 16px; margin-top: 10px;}
        .btn-upg { background: #3498db; width: 100%; margin-bottom: 10px; }

        @media (min-width: 768px) {
            .dashboard { flex: 0 0 auto; padding: 20px; }
            .game-viewport { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="game-viewport" id="viewport">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="stat-badge money">💰 $<span id="moneyText">500</span></div>
            <div class="stat-badge stock">🚗 Stock: <span id="stockText">0</span></div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="dashboard-grid">
            <div class="panel-section">
                <h3>Buy Raw Materials</h3>
                <div class="part-row">
                    <span>Steel Frame (<span id="chassisCount">0</span>)</span>
                    <button class="btn-buy" id="btnChassis" onclick="buyPart('chassis')">Buy 1 ($50)</button>
                </div>
                <div class="part-row">
                    <span>V8 Engine (<span id="engineCount">0</span>)</span>
                    <button class="btn-buy" id="btnEngine" onclick="buyPart('engine')">Buy 1 ($100)</button>
                </div>
                <div class="part-row">
                    <span>Tire Set (<span id="tireCount">0</span>/4)</span>
                    <button class="btn-buy" id="btnTire" onclick="buyPart('tire')">Buy 4 ($40)</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>Logistics & Sales</h3>
                <button class="btn-sell" id="sellCarsBtn" onclick="sellCars()">Ship All Cars ($<span id="carPriceText">300</span>/ea)</button>
                <div style="text-align: center; margin-top: 15px; font-size: 13px; color: #7f8c8d;" id="lineStatus">
                    Factory Status: Idle
                </div>
            </div>
            
            <div class="panel-section">
                <h3>Facility Upgrades</h3>
                <button class="btn-upg" id="upgAssemblyBtn" onclick="upgradeAssembly()">Upgrade Automation ($<span id="assemblyCostText">150</span>)</button>
                <button class="btn-upg" id="upgMarketingBtn" onclick="upgradeMarketing()" style="background: #9b59b6;">Upgrade Marketing ($<span id="marketingCostText">200</span>)</button>
            </div>
        </div>
    </div>

    <script>
        // --- CANVAS & SCALING SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        const WORLD_WIDTH = 2500;
        const WORLD_HEIGHT = 1500;
        let camera = { x: WORLD_WIDTH/2 - window.innerWidth/2, y: WORLD_HEIGHT/2 - 300 };
        let isDragging = false, lastMouseX = 0, lastMouseY = 0;

        function resizeCanvas() {
            // Handle high-DPI displays for crisp mobile graphics
            const dpr = window.devicePixelRatio || 1;
            canvas.width = viewport.clientWidth * dpr;
            canvas.height = viewport.clientHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = viewport.clientWidth + 'px';
            canvas.style.height = viewport.clientHeight + 'px';
            clampCamera();
        }
        window.addEventListener('resize', resizeCanvas);

        function clampCamera() {
            camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - (canvas.width / (window.devicePixelRatio || 1))));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - (canvas.height / (window.devicePixelRatio || 1))));
        }

        // --- CAMERA PANNING ---
        function handlePointerDown(e) { isDragging = true; lastMouseX = e.touches ? e.touches[0].clientX : e.clientX; lastMouseY = e.touches ? e.touches[0].clientY : e.clientY; }
        function handlePointerMove(e) {
            if (!isDragging) return;
            let currentX = e.touches ? e.touches[0].clientX : e.clientX;
            let currentY = e.touches ? e.touches[0].clientY : e.clientY;
            camera.x -= (currentX - lastMouseX); camera.y -= (currentY - lastMouseY);
            clampCamera(); lastMouseX = currentX; lastMouseY = currentY;
        }
        function handlePointerUp() { isDragging = false; }

        viewport.addEventListener('mousedown', handlePointerDown); window.addEventListener('mousemove', handlePointerMove); window.addEventListener('mouseup', handlePointerUp);
        viewport.addEventListener('touchstart', handlePointerDown, {passive: false}); window.addEventListener('touchmove', handlePointerMove, {passive: false}); window.addEventListener('touchend', handlePointerUp);

        // --- GAME STATE ---
        let state = {
            money: 500, parts: { chassis: 0, engine: 0, tires: 0 },
            carsInStock: 0, assemblySpeed: 1.0,
            upgrades: { assembly: 150, marketing: 200 },
            carSellPrice: 300
        };
        const PRICES = { chassis: 50, engine: 100, tires: 40 };

        // Factory Stations
        const STATIONS = {
            chassis: { x: WORLD_WIDTH/2 - 600, name: "Frame Dept" },
            engine: { x: WORLD_WIDTH/2 - 100, name: "Engine Install" },
            tires: { x: WORLD_WIDTH/2 + 400, name: "Wheel Assembly" },
            end: { x: WORLD_WIDTH/2 + 900 }
        };

        let carsOnLine = []; // Cars currently being built
        let beltOffset = 0;

        function formatMoney(amount) {
            if (amount >= 1000000) return (amount / 1000000).toFixed(2) + "M";
            if (amount >= 1000) return (amount / 1000).toFixed(1) + "k";
            return amount.toFixed(0);
        }

        function updateUI() {
            document.getElementById('moneyText').innerText = formatMoney(state.money);
            document.getElementById('stockText').innerText = state.carsInStock;
            document.getElementById('chassisCount').innerText = state.parts.chassis;
            document.getElementById('engineCount').innerText = state.parts.engine;
            document.getElementById('tireCount').innerText = state.parts.tires;
            
            document.getElementById('btnChassis').disabled = state.money < PRICES.chassis;
            document.getElementById('btnEngine').disabled = state.money < PRICES.engine;
            document.getElementById('btnTire').disabled = state.money < PRICES.tires;
            
            document.getElementById('sellCarsBtn').disabled = state.carsInStock === 0;
            document.getElementById('carPriceText').innerText = formatMoney(state.carSellPrice);
            
            document.getElementById('upgAssemblyBtn').disabled = state.money < state.upgrades.assembly;
            document.getElementById('assemblyCostText').innerText = formatMoney(state.upgrades.assembly);
            document.getElementById('upgMarketingBtn').disabled = state.money < state.upgrades.marketing;
            document.getElementById('marketingCostText').innerText = formatMoney(state.upgrades.marketing);
        }

        function buyPart(type) {
            if (type === 'chassis' && state.money >= PRICES.chassis) { state.money -= PRICES.chassis; state.parts.chassis++; }
            if (type === 'engine' && state.money >= PRICES.engine) { state.money -= PRICES.engine; state.parts.engine++; }
            if (type === 'tire' && state.money >= PRICES.tires) { state.money -= PRICES.tires; state.parts.tires += 4; }
            updateUI();
        }

        function sellCars() { 
            if (state.carsInStock > 0) { 
                state.money += (state.carsInStock * state.carSellPrice); 
                state.carsInStock = 0; updateUI(); 
            } 
        }

        function upgradeAssembly() { 
            if (state.money >= state.upgrades.assembly) { 
                state.money -= state.upgrades.assembly; 
                state.assemblySpeed *= 1.3; 
                state.upgrades.assembly = Math.floor(state.upgrades.assembly * 1.6); 
                updateUI(); 
            } 
        }

        function upgradeMarketing() { 
            if (state.money >= state.upgrades.marketing) { 
                state.money -= state.upgrades.marketing; 
                state.carSellPrice = Math.floor(state.carSellPrice * 1.5); 
                state.upgrades.marketing = Math.floor(state.upgrades.marketing * 1.8); 
                updateUI(); 
            } 
        }

        // --- GRAPHICS & RENDERING ---
        function drawWorker(ctx, x, y, isWorking) {
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
            
            // Base uniform
            ctx.fillStyle = "#2980b9";
            ctx.beginPath(); ctx.roundRect(x - 20, y - 20, 40, 40, 10); ctx.fill();
            
            // Hard hat
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath(); ctx.arc(x, y - 10, 18, 0, Math.PI * 2); ctx.fill();
            
            // Face
            ctx.fillStyle = "#f39c12";
            ctx.beginPath(); ctx.arc(x, y + 2, 12, 0, Math.PI * 2); ctx.fill();
            
            // Arms
            ctx.shadowColor = 'transparent';
            let armAngle = isWorking ? Math.sin(Date.now() / 100 * state.assemblySpeed) * 0.8 : 0;
            
            ctx.translate(x, y - 5); ctx.rotate(armAngle);
            ctx.fillStyle = "#2980b9";
            ctx.beginPath(); ctx.roundRect(-5, -5, 10, 35, 5); ctx.fill();
            ctx.restore();
        }

        function drawCar(ctx, x, y, stage, color) {
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 8;
            
            // Stage 1: Chassis (Metal Frame)
            if (stage >= 0) {
                let grad = ctx.createLinearGradient(x, y, x, y + 40);
                grad.addColorStop(0, "#7f8c8d"); grad.addColorStop(1, "#2c3e50");
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.roundRect(x, y - 20, 100, 40, 5); ctx.fill();
            }
            
            // Stage 2: Engine & Body
            if (stage >= 1) {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.roundRect(x + 10, y - 25, 80, 50, 8); ctx.fill();
                
                // Windshield
                ctx.fillStyle = "#bdc3c7";
                ctx.beginPath(); ctx.roundRect(x + 25, y - 15, 20, 30, 3); ctx.fill();
                ctx.beginPath(); ctx.roundRect(x + 55, y - 15, 20, 30, 3); ctx.fill();
                
                // Engine block detail
                ctx.fillStyle = "#333";
                ctx.fillRect(x + 85, y - 10, 10, 20);
            }
            
            // Stage 3: Tires
            if (stage >= 2) {
                ctx.fillStyle = "#111";
                // Top tires
                ctx.beginPath(); ctx.roundRect(x + 15, y - 35, 25, 15, 4); ctx.fill();
                ctx.beginPath(); ctx.roundRect(x + 65, y - 35, 25, 15, 4); ctx.fill();
                // Bottom tires
                ctx.beginPath(); ctx.roundRect(x + 15, y + 20, 25, 15, 4); ctx.fill();
                ctx.beginPath(); ctx.roundRect(x + 65, y + 20, 25, 15, 4); ctx.fill();
            }
            ctx.restore();
        }

        function gameLoop() {
            resizeCanvas(); // Ensure high DPI is maintained
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            // Apply Camera
            const dpr = window.devicePixelRatio || 1;
            ctx.translate(-camera.x, -camera.y);

            // Draw Factory Floor Pattern
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            ctx.strokeStyle = "#bdc3c7"; ctx.lineWidth = 2;
            for (let i = 0; i < WORLD_WIDTH; i += 150) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_HEIGHT); ctx.stroke();
            }
            for (let i = 0; i < WORLD_HEIGHT; i += 150) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_WIDTH, i); ctx.stroke();
            }

            const beltY = WORLD_HEIGHT / 2;
            
            // Draw Conveyor Belt Background
            ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 15;
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(STATIONS.chassis.x - 100, beltY - 50, STATIONS.end.x - STATIONS.chassis.x + 200, 100);
            
            // Conveyor Rollers (Animated)
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = "#34495e"; ctx.lineWidth = 6;
            let beltMoving = carsOnLine.some(c => c.moving);
            if (beltMoving) beltOffset += 1.5 * state.assemblySpeed;
            if (beltOffset > 30) beltOffset = 0;
            
            for (let i = STATIONS.chassis.x - 100; i < STATIONS.end.x + 100; i += 30) {
                ctx.beginPath(); ctx.moveTo(i + beltOffset, beltY - 45); ctx.lineTo(i + beltOffset, beltY + 45); ctx.stroke();
            }

            // Factory Logic & Car Processing
            // 1. Spawn new chassis if Station 1 is empty and we have parts
            let station1Clear = !carsOnLine.some(c => c.x < STATIONS.chassis.x + 120);
            if (station1Clear && state.parts.chassis >= 1) {
                state.parts.chassis--;
                carsOnLine.push({ 
                    x: STATIONS.chassis.x - 100, 
                    stage: 0, 
                    targetX: STATIONS.engine.x, 
                    moving: true, 
                    workTimer: 0,
                    color: `hsl(${Math.random() * 360}, 75%, 50%)`
                });
                updateUI();
            }

            let activeWorkers = { chassis: false, engine: false, tires: false };

            for (let i = carsOnLine.length - 1; i >= 0; i--) {
                let car = carsOnLine[i];

                if (car.moving) {
                    car.x += 2 * state.assemblySpeed;
                    // Stop at target station
                    if (car.x >= car.targetX) {
                        car.x = car.targetX;
                        car.moving = false;
                    }
                } else {
                    // Processing at a station
                    if (car.stage === 0 && car.x === STATIONS.engine.x) {
                        if (state.parts.engine >= 1) {
                            activeWorkers.engine = true;
                            car.workTimer += 1 * state.assemblySpeed;
                            if (car.workTimer > 60) {
                                state.parts.engine--;
                                car.stage = 1;
                                car.workTimer = 0;
                                car.targetX = STATIONS.tires.x;
                                car.moving = true;
                                updateUI();
                            }
                        }
                    } 
                    else if (car.stage === 1 && car.x === STATIONS.tires.x) {
                        if (state.parts.tires >= 4) {
                            activeWorkers.tires = true;
                            car.workTimer += 1 * state.assemblySpeed;
                            if (car.workTimer > 60) {
                                state.parts.tires -= 4;
                                car.stage = 2;
                                car.targetX = STATIONS.end.x;
                                car.moving = true;
                                updateUI();
                            }
                        }
                    }
                }

                // Draw the car
                drawCar(ctx, car.x, beltY, car.stage, car.color);

                // Reached the end
                if (car.x >= STATIONS.end.x) {
                    state.carsInStock++;
                    carsOnLine.splice(i, 1);
                    updateUI();
                }
            }

            // Draw Stations & Workers
            function drawStation(x, name, isWorking) {
                // Control Panel
                ctx.fillStyle = "#95a5a6";
                ctx.beginPath(); ctx.roundRect(x - 40, beltY - 120, 80, 50, 5); ctx.fill();
                ctx.fillStyle = "#2c3e50"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(name, x, beltY - 90);
                
                // Worker
                drawWorker(ctx, x, beltY - 150, isWorking);
            }

            drawStation(STATIONS.chassis.x, "1. FRAME", station1Clear === false); // Simulating work if frame is spawned
            drawStation(STATIONS.engine.x, "2. ENGINE", activeWorkers.engine);
            drawStation(STATIONS.tires.x, "3. WHEELS", activeWorkers.tires);

            // Update Status Text
            let statusEl = document.getElementById('lineStatus');
            if (activeWorkers.engine || activeWorkers.tires || (!station1Clear && state.parts.chassis > 0)) {
                statusEl.innerText = "🟢 Assembly Line Active";
                statusEl.style.color = "#27ae60";
            } else if (carsOnLine.length > 0) {
                statusEl.innerText = "🔴 Line Stalled - Missing Parts";
                statusEl.style.color = "#e74c3c";
            } else {
                statusEl.innerText = "⚪ Factory Idle - Awaiting Frames";
                statusEl.style.color = "#7f8c8d";
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        // Initialize
        updateUI();
        resizeCanvas();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
