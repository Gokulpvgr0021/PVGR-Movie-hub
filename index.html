<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnum Clothing - Inward Entry Register</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --success: #166534;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
    .wrapper { max-width: 1250px; margin: 0 auto; }

    /* Top Navigation Header */
    .top-header {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      border-radius: 8px 8px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-header h1 { margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .top-header span { font-size: 13px; opacity: 0.85; }

    .main-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: none;
      padding: 24px;
      border-radius: 0 0 8px 8px;
    }

    /* Form Container */
    .notebook-form {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .form-title { font-weight: 700; color: var(--primary); margin-bottom: 12px; font-size: 14px; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; text-transform: uppercase; }
    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }

    .btn-bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-success { background: var(--success); color: white; }

    /* Notebook Register Table */
    .register-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .search-input { width: 280px; }

    .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { background: #f1f5f9; padding: 10px 8px; border-bottom: 2px solid var(--border); color: #334155; white-space: nowrap; }
    td { padding: 8px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; white-space: nowrap; }
    tr:hover { background: #f8fafc; }

    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 10px;
      text-transform: uppercase;
    }
    .status-ok { background: #dcfce7; color: #15803d; }
    .status-short { background: #fee2e2; color: #b91c1c; }

    @media print {
      body { background: white; padding: 0; }
      .notebook-form, .btn-bar, .search-input, .no-print { display: none !important; }
      .main-content { border: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="top-header">
    <div>
      <h1>MAGNUM CLOTHING</h1>
      <span>Security Gate & Store Inward Entry Notebook</span>
    </div>
    <div style="text-align: right;">
      <span id="liveClock"></span>
    </div>
  </div>

  <div class="main-content">
    <!-- Entry Form -->
    <div class="notebook-form no-print">
      <div class="form-title">+ New Material Inward Entry (GRN)</div>
      <form id="entryForm">
        <div class="grid">
          <div class="field">
            <label>Entry Date & Time</label>
            <input type="datetime-local" id="inTime" required>
          </div>
          <div class="field">
            <label>Vendor / Supplier</label>
            <input type="text" id="vendor" placeholder="e.g. Vardhman Textiles" required>
          </div>
          <div class="field">
            <label>DC / Invoice No.</label>
            <input type="text" id="dcNo" placeholder="e.g. DC-9842" required>
          </div>
          <div class="field">
            <label>PO Reference</label>
            <input type="text" id="poNo" placeholder="e.g. PO-2026-104" required>
          </div>
          <div class="field">
            <label>Item / Fabric / Trim</label>
            <input type="text" id="itemName" placeholder="e.g. Cotton Twill Fabric" required>
          </div>
          <div class="field">
            <label>No. of Rolls / Cartons</label>
            <input type="number" id="packages" placeholder="e.g. 15" required>
          </div>
          <div class="field">
            <label>Challan Qty</label>
            <input type="number" id="challanQty" step="any" placeholder="Dispatched Qty" required>
          </div>
          <div class="field">
            <label>Received Qty</label>
            <input type="number" id="receivedQty" step="any" placeholder="Counted Qty" required>
          </div>
          <div class="field">
            <label>Unit (UOM)</label>
            <select id="uom">
              <option value="Meters">Meters</option>
              <option value="Pieces">Pieces</option>
              <option value="Kgs">Kgs</option>
              <option value="Cones">Cones</option>
            </select>
          </div>
          <div class="field">
            <label>Vehicle No.</label>
            <input type="text" id="vehicleNo" placeholder="e.g. TN-09-AX-5544" required>
          </div>
          <div class="field">
            <label>Receiver / Gatekeeper</label>
            <input type="text" id="receiver" placeholder="Your Name" required>
          </div>
          <div class="field">
            <label>Remarks / Quality Check</label>
            <input type="text" id="remarks" placeholder="Roll condition, seal intact, etc.">
          </div>
        </div>
        <div class="btn-bar">
          <button type="reset" class="btn btn-secondary">Clear</button>
          <button type="submit" class="btn btn-primary">Log Inward Entry</button>
        </div>
      </form>
    </div>

    <!-- Notebook Register Log -->
    <div class="register-header">
      <div style="font-weight: 700; font-size: 15px;">DAILY INWARD LOG BOOK</div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="searchBox" class="search-input" placeholder="Search Vendor, DC, or Vehicle..." onkeyup="renderTable()">
        <button class="btn btn-secondary no-print" onclick="window.print()">Print Register</button>
        <button class="btn btn-success no-print" onclick="exportToCSV()">Export CSV</button>
      </div>
    </div>

    <div class="table-container">
      <table id="notebookTable">
        <thead>
          <tr>
            <th>GRN #</th>
            <th>Date & Time</th>
            <th>Vendor</th>
            <th>DC / Inv #</th>
            <th>PO #</th>
            <th>Item Details</th>
            <th>Pkgs</th>
            <th>Challan</th>
            <th>Received</th>
            <th>Diff</th>
            <th>Vehicle #</th>
            <th>Receiver</th>
            <th>Status</th>
            <th class="no-print">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically populated entries -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Clock display
  setInterval(() => {
    document.getElementById('liveClock').innerText = new Date().toLocaleString();
  }, 1000);

  // Set default datetime to now
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('inTime').value = now.toISOString().slice(0,16);

  // Storage key
  const STORAGE_KEY = 'MAGNUM_GRN_LOGS';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    {
      grn: 'MC-26-001',
      time: '2026-09-09 10:15',
      vendor: 'Arvind Mills Ltd.',
      dcNo: 'DC-8812',
      poNo: 'PO-0412',
      item: 'Indigo Denim 14oz',
      packages: 20,
      challanQty: 1000,
      receivedQty: 1000,
      uom: 'Meters',
      vehicle: 'TN-01-AB-1234',
      receiver: 'Senthil',
      remarks: 'Seals OK'
    }
  ];

  function saveAndRefresh() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    renderTable();
  }

  function renderTable() {
    const filter = document.getElementById('searchBox').value.toLowerCase();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    entries.forEach((item, index) => {
      const rowSearch = `${item.grn} ${item.vendor} ${item.dcNo} ${item.vehicle} ${item.item}`.toLowerCase();
      if (!rowSearch.includes(filter)) return;

      const diff = Number(item.receivedQty) - Number(item.challanQty);
      const isShort = diff < 0;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${item.grn}</strong></td>
        <td>${item.time}</td>
        <td>${item.vendor}</td>
        <td>${item.dcNo}</td>
        <td>${item.poNo}</td>
        <td>${item.item}</td>
        <td>${item.packages}</td>
        <td>${item.challanQty} ${item.uom}</td>
        <td>${item.receivedQty} ${item.uom}</td>
        <td style="color:${isShort ? '#b91c1c' : '#15803d'}; font-weight:600;">${diff > 0 ? '+' + diff : diff}</td>
        <td>${item.vehicle}</td>
        <td>${item.receiver}</td>
        <td><span class="status-badge ${isShort ? 'status-short' : 'status-ok'}">${isShort ? 'Shortage' : 'Complete'}</span></td>
        <td class="no-print"><button onclick="deleteEntry(${index})" style="color:red; border:none; background:none; cursor:pointer;">✕</button></td>
      `;
      tbody.appendChild(row);
    });
  }

  document.getElementById('entryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const count = entries.length + 1;
    const padded = String(count).padStart(3, '0');
    
    const newEntry = {
      grn: `MC-26-${padded}`,
      time: document.getElementById('inTime').value.replace('T', ' '),
      vendor: document.getElementById('vendor').value,
      dcNo: document.getElementById('dcNo').value,
      poNo: document.getElementById('poNo').value,
      item: document.getElementById('itemName').value,
      packages: document.getElementById('packages').value,
      challanQty: document.getElementById('challanQty').value,
      receivedQty: document.getElementById('receivedQty').value,
      uom: document.getElementById('uom').value,
      vehicle: document.getElementById('vehicleNo').value,
      receiver: document.getElementById('receiver').value,
      remarks: document.getElementById('remarks').value
    };

    entries.unshift(newEntry);
    saveAndRefresh();
    this.reset();
    document.getElementById('inTime').value = new Date().toISOString().slice(0,16);
  });

  function deleteEntry(idx) {
    if (confirm('Delete this entry from register?')) {
      entries.splice(idx, 1);
      saveAndRefresh();
    }
  }

  function exportToCSV() {
    let csv = "GRN,Date,Vendor,DC No,PO No,Item,Packages,Challan Qty,Received Qty,UOM,Vehicle,Receiver,Remarks\n";
    entries.forEach(e => {
      csv += `"${e.grn}","${e.time}","${e.vendor}","${e.dcNo}","${e.poNo}","${e.item}",${e.packages},${e.challanQty},${e.receivedQty},"${e.uom}","${e.vehicle}","${e.receiver}","${e.remarks || ''}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Magnum_Inward_Notebook_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  // Initial load
  renderTable();
</script>

</body>
</html>
